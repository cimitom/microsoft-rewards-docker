services:
  microsoft-rewards:
    image: wangheqiang/microsoft-rewards-docker:latest
    # 或者使用 GitHub Packages 镜像：
    # image: ghcr.io/wangheqiang530/microsoft-rewards-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rewards
    restart: unless-stopped
    ports:
      - "5308:5308"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5308
      - EPIC_VISIBLE=${EPIC_VISIBLE:-1}
      - VNC_ENABLED=${VNC_ENABLED:-1}
      - NOVNC_PORT=6080
      - VNC_PORT=5900
      - WINDOWS_FONT_DIR=/usr/share/fonts/truetype/windows
      - MS_LOGIN_TIMEOUT_MIN=${MS_LOGIN_TIMEOUT_MIN:-20}
      # 登录窗口超过该分钟数未保存则自动关闭；设为 0 关闭保护
      - EPIC_LOGIN_TIMEOUT_MIN=${EPIC_LOGIN_TIMEOUT_MIN:-30}
      # 领取遇到 Epic 人机验证时，允许在可见浏览器中人工完成的等待秒数
      - EPIC_CHALLENGE_WAIT_SEC=${EPIC_CHALLENGE_WAIT_SEC:-90}
    volumes:
      - ./data:/app/data
      - ./data/fonts/windows:/usr/share/fonts/truetype/windows:ro
    # 仅在使用核显加速时取消注释；没有 /dev/dri 的设备会导致容器启动失败。
    # devices:
    #   - /dev/dri:/dev/dri
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
