version: '3.8'

services:
  microsoft-rewards:
    image: wangheqiang/microsoft-rewards-docker:latest
    # 或者使用 GitHub Packages 镜像：
    # image: ghcr.io/wangheqiang530/microsoft-rewards-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rewards
    restart: unless-stopped
    ports:
      - "5308:5308"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5308
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
