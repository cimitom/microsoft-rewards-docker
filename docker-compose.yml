version: '3.8'

services:
  microsoft-rewards:
    image: wangheqiang/microsoft-rewards-docker:latest
    # 或者使用 GitHub Packages 镜像：
    # image: ghcr.io/wangheqiang530/microsoft-rewards-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rewards
    restart: unless-stopped
    ports:
      - "5308:5308"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5308
      - EPIC_VISIBLE=${EPIC_VISIBLE:-1}
      - NOVNC_PASSWORD=${NOVNC_PASSWORD:-}
      - NOVNC_PORT=6080
      - VNC_PORT=5900
      # 登录窗口超过该分钟数未保存则自动关闭；设为 0 关闭保护
      - EPIC_LOGIN_TIMEOUT_MIN=${EPIC_LOGIN_TIMEOUT_MIN:-30}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
