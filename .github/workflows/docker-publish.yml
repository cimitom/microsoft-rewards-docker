name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送镜像（关闭则只做构建校验，latest 不会移动）'
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 判断本次是「发版推送」还是「仅构建校验」
      #   push tag v*  -> 推送镜像：版本号 + 次版本号 + latest
      #   push main    -> 只构建校验，不推送，latest 保持不动
      #   手动触发      -> 由 publish 入参决定
      - name: Determine publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::发版推送，将构建并发布多架构镜像"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::手动触发并开启发布，将构建并发布镜像"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仅构建校验，不推送任何镜像标签"
          fi

      - name: Set up QEMU
        if: steps.mode.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 登录 Docker Hub (如果配置了 Secret)
      - name: Log in to Docker Hub
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'wangheqiang' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 提取元数据和 Tag（仅发版时执行）
      #    latest 只在发版推送/手动发布时更新，普通 main 推送不会移动它
      - name: Extract metadata for Docker
        id: meta
        if: steps.mode.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME || 'wangheqiang' }}/microsoft-rewards-docker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 4. 构建镜像
      #    发版：构建 amd64 + arm64 并推送
      #    校验：只构建 amd64 不推送，用于验证 Dockerfile 未损坏（速度也更快）
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ steps.mode.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
